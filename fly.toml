# Fly.io config. Deploy with:
#   fly launch --copy-config --no-deploy   (pick a name & region when asked)
#   fly volumes create data --size 1
#   fly secrets set GOOGLE_CLIENT_ID=xxxx.apps.googleusercontent.com
#   fly deploy
app = "timeavailable"
primary_region = "sjc"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
