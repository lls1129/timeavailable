# Deploys the static (serverless) version of the app to GitHub Pages.
# Requires: repo Settings → Pages → Source = "GitHub Actions" (Pages needs a public repo on free plans).
# Optional: a repository variable GOOGLE_CLIENT_ID to enable the Google Calendar button.
name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
    paths: [public/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        run: |
          mkdir -p _site
          cp -r public/* _site/
          printf 'window.TA_CONFIG = { static: true, googleClientId: %s };\n' "$(printf '%s' "${{ vars.GOOGLE_CLIENT_ID }}" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" > _site/config.js
          cat _site/config.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
