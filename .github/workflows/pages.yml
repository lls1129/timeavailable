# Publishes the static (serverless) version of the app to GitHub Pages by
# rebuilding the `gh-pages` branch from public/ on every push to main.
# Pages source for this repo: branch `gh-pages`, folder `/` (root).
# Optional: a repository variable GOOGLE_CLIENT_ID enables the Google Calendar button.
name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
    paths: [public/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        run: |
          mkdir -p _site
          cp -r public/* _site/
          touch _site/.nojekyll
          printf 'window.TA_CONFIG = { static: true, googleClientId: %s };\n' "$(printf '%s' "${{ vars.GOOGLE_CLIENT_ID }}" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" > _site/config.js
          cat _site/config.js
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
